    <title>MyFinBank - Customer Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0;">

<div style="background: white; padding: 60px 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; text-align: center;">
    <div style="margin-bottom: 40px;">
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; color: white; font-size: 48px; font-weight: 800;">M</div>
        <h1 style="font-size: 32px; font-weight: 800; color: #10203c; margin: 0 0 12px;">MyFinBank</h1>

    <div style="display: grid; gap: 12px;">
        <a href="login.html" style="display: block; padding: 14px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 16px; transition: transform 0.2s; border: none; cursor: pointer;">
