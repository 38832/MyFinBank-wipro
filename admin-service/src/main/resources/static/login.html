<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - MyFinBank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
</head>
<body style="background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0;">

<div style="background: white; padding: 60px 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%;">
    <div style="margin-bottom: 40px; text-align: center;">
        <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: white; font-size: 36px; font-weight: 800;">M</div>
        <h1 style="font-size: 28px; font-weight: 800; color: #10203c; margin: 0;">Admin Sign In</h1>
        <p style="font-size: 14px; color: #6b7280; margin: 8px 0 0;">Access the admin console</p>
    </div>

    <form id="loginForm" style="display: grid; gap: 18px;">
        <div style="display: grid; gap: 6px;">
            <label style="font-weight: 600; color: #374151; font-size: 14px;">Email Address</label>
            <input type="email" id="email" required placeholder="admin@example.com" style="padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: Inter, sans-serif;">
        </div>

        <div style="display: grid; gap: 6px;">
            <label style="font-weight: 600; color: #374151; font-size: 14px;">Password</label>
            <input type="password" id="password" required placeholder="••••••••" style="padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: Inter, sans-serif;">
        </div>

        <button type="submit" style="padding: 12px 24px; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; transition: transform 0.2s;">
            Sign In
        </button>
    </form>

    <div id="loginMessage" style="margin-top: 18px; padding: 12px; border-radius: 8px; display: none;"></div>

    <div style="margin-top: 20px; text-align: center;">
        <a href="index.html" style="color: #6b7280; text-decoration: none; font-size: 14px;">← Back to Home</a>
    </div>
</div>

<div id="notificationContainer" class="notification-toast"></div>

<script src="admin-auth.js"></script>
</body>
</html>
